<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>激活码管理 · cute pet 后台</title>
  <link rel="stylesheet" href="/static/tabler.min.css" />
  <script>
    if (!localStorage.getItem('petAdminSession')) location.replace('/admin/login');
  </script>
</head>
<body class="antialiased">
  <div class="page">
    <header class="navbar navbar-expand-md navbar-dark bg-dark d-print-none">
      <div class="container-xl">
        <span class="navbar-brand">🐾 cute pet 后台管理</span>
        <div class="navbar-nav flex-row ms-auto align-items-center">
          <a class="nav-link" href="/admin">在线宠物</a>
          <a class="nav-link active fw-bold" href="/admin/codes">激活码管理</a>
          <a class="nav-link" href="/admin/status">服务器状态</a>
          <a class="nav-link" href="/admin/files">文件管理</a>
          <a class="nav-link" href="/online" target="_blank">手机版</a>
          <a class="nav-link ms-3 text-warning" href="javascript:logout()">退出登录</a>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col">
              <h2 class="page-title">激活码管理</h2>
              <div class="text-secondary mt-1" id="status">加载中…</div>
            </div>
            <div class="col-auto ms-auto">
              <button class="btn" onclick="loadList()">刷新</button>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">
          <div class="row row-cards">

            <div class="col-12">
              <div class="card">
                <div class="card-header"><h3 class="card-title">生成激活码</h3></div>
                <div class="card-body">
                  <div class="row g-3">
                    <div class="col-6 col-md-2">
                      <label class="form-label">数量（1~100）</label>
                      <input type="number" id="count" class="form-control" value="1" min="1" max="100" />
                    </div>
                    <div class="col-6 col-md-2">
                      <label class="form-label">每码设备数</label>
                      <input type="number" id="maxDevices" class="form-control" value="3" min="1" max="10" />
                    </div>
                    <div class="col-6 col-md-2">
                      <label class="form-label">有效期（天）</label>
                      <input type="number" id="validDays" class="form-control" value="0" min="0" max="3650" />
                      <div class="form-hint">0 = 永久有效</div>
                    </div>
                    <div class="col-6 col-md-2">
                      <label class="form-label">AI 生图次数</label>
                      <input type="number" id="imageQuota" class="form-control" value="0" min="0" max="100000" />
                      <div class="form-hint">0 = 未开通</div>
                    </div>
                    <div class="col-6 col-md-2">
                      <label class="form-label">备注</label>
                      <input type="text" id="note" class="form-control" placeholder="如：面包多订单" />
                    </div>
                    <div class="col-6 col-md-2 d-flex align-items-start pt-4">
                      <button class="btn btn-primary w-100" onclick="generate()">生成</button>
                    </div>
                  </div>
                  <div id="newCodes" class="mt-3"></div>
                </div>
              </div>
            </div>

            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">全部激活码</h3>
                  <span class="ms-2 text-secondary" id="total"></span>
                </div>
                <div class="table-responsive">
                  <table class="table table-vcenter card-table table-hover">
                    <thead>
                      <tr>
                        <th>激活码</th>
                        <th>设备绑定</th>
                        <th>AI 生图</th>
                        <th>备注</th>
                        <th>生成时间</th>
                        <th>过期时间</th>
                        <th class="w-1"></th>
                      </tr>
                    </thead>
                    <tbody id="list"></tbody>
                  </table>
                </div>
                <div class="card-body text-secondary text-center" id="empty" style="display:none">
                  还没有激活码，先在上方生成吧
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <footer class="footer footer-transparent d-print-none">
        <div class="container-xl text-center text-secondary">
          cute pet 后端服务 · UI 基于 Tabler（MIT）
        </div>
      </footer>
    </div>
  </div>

  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
      ));
    }

    function session() { return localStorage.getItem('petAdminSession') || ''; }

    async function logout() {
      const token = session();
      localStorage.removeItem('petAdminSession');
      localStorage.removeItem('petAdminSessionExp');
      try {
        await fetch('/api/admin/logout', { method: 'POST', headers: { 'X-Session-Token': token } });
      } catch (e) { /* 忽略网络异常 */ }
      location.href = '/admin/login';
    }

    // 复制到剪贴板：HTTP 页面下 navigator.clipboard 不可用（仅 HTTPS/localhost），
    // 因此回退到 execCommand 方案；两者都失败时如实提示，不假装成功。
    async function copyText(text) {
      if (window.isSecureContext && navigator.clipboard) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) { /* 继续回退 */ }
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    // 兜底：把激活码文本选中，用户可直接 ⌘C
    function selectCodeText(text) {
      const cells = document.querySelectorAll('.code-cell');
      for (const cell of cells) {
        if (cell.textContent.trim() === text) {
          const range = document.createRange();
          range.selectNodeContents(cell);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          return true;
        }
      }
      return false;
    }

    async function copyCode(text, btn) {
      const old = btn.textContent;
      const ok = await copyText(text);
      if (ok) {
        btn.textContent = '已复制 ✓';
      } else {
        // 复制受限（如非安全上下文）：选中文本让用户 ⌘C，并如实提示
        const selected = selectCodeText(text);
        btn.textContent = selected ? '已选中，⌘C' : '请手动复制';
        btn.classList.add('btn-outline-danger');
      }
      setTimeout(() => {
        btn.textContent = old;
        btn.classList.remove('btn-outline-danger');
      }, 1600);
    }

    async function api(path, options) {
      const opts = Object.assign({
        headers: { 'Content-Type': 'application/json', 'X-Session-Token': session() }
      }, options);

      async function once() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
          return await fetch(path, Object.assign({ signal: ctrl.signal }, opts));
        } finally {
          clearTimeout(timer);
        }
      }

      // 仅查询类请求重试；生成激活码等写操作重试会造成重复执行
      const isRead = !(opts.method && String(opts.method).toUpperCase() !== 'GET');
      let resp;
      try {
        resp = await once();
      } catch (e) {
        if (!isRead) throw e;
        resp = await once();
      }
      if (resp.status === 401) {
        localStorage.removeItem('petAdminSession');
        location.replace('/admin/login');
        throw new Error('登录已失效，请重新登录');
      }
      let json = null;
      try { json = await resp.json(); } catch (e) { json = null; }
      if (!json) throw new Error('HTTP ' + resp.status + '（服务未响应或返回异常）');
      if (json.code !== 0) throw new Error('HTTP ' + resp.status + ' · ' + (json.msg || '请求失败'));
      return json.data;
    }

    async function loadList() {
      try {
        const data = await api('/api/admin/codes');
        document.getElementById('status').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
        render(data.codes || []);
      } catch (e) {
        document.getElementById('status').textContent = '加载失败：' + e.message;
      }
    }

    async function generate() {
      const box = document.getElementById('newCodes');
      try {
        const data = await api('/api/admin/codes/generate', {
          method: 'POST',
          body: JSON.stringify({
            count: parseInt(document.getElementById('count').value, 10),
            maxDevices: parseInt(document.getElementById('maxDevices').value, 10),
            validDays: parseInt(document.getElementById('validDays').value, 10) || 0,
            imageQuota: parseInt(document.getElementById('imageQuota').value, 10) || 0,
            note: document.getElementById('note').value.trim()
          })
        });
        box.innerHTML = '<div class="alert alert-success mb-0"><div class="fw-bold mb-2">生成成功（点击复制）：</div>' +
          (data.codes || []).map(c =>
            '<button class="btn btn-sm btn-outline-success me-2 mb-2 font-monospace" onclick="copyCode(\'' + c + '\', this)">' + esc(c) + '</button>'
          ).join('') + '</div>';
        loadList();
      } catch (e) {
        box.innerHTML = '<div class="alert alert-danger mb-0">' + esc(e.message) + '</div>';
      }
    }

    function expiryCell(c) {
      if (!c.expiresAt) return '<span class="badge bg-blue-lt">永久</span>';
      const exp = new Date(c.expiresAt);
      const expired = exp.getTime() < Date.now();
      const text = exp.toLocaleString('zh-CN');
      return expired
        ? '<span class="badge bg-red-lt">已过期</span> <span class="text-secondary">' + text + '</span>'
        : '<span class="badge bg-green-lt">有效</span> <span class="text-secondary">' + text + '</span>';
    }

    async function deleteCode(code) {
      if (!confirm('确认删除激活码 ' + code + '？\n删除后不可恢复，已绑定的设备也会一并清除。')) return;
      try {
        await api('/api/admin/codes/delete', {
          method: 'POST',
          body: JSON.stringify({ code: code })
        });
        loadList();
      } catch (e) {
        alert('删除失败：' + e.message);
      }
    }

    async function unbind(code) {
      if (!confirm('解绑激活码 ' + code + ' 的全部已绑定设备？\n解绑后该码可在新设备重新激活。')) return;
      try {
        await api('/api/admin/codes/unbind', {
          method: 'POST',
          body: JSON.stringify({ code: code })
        });
        loadList();
      } catch (e) {
        alert('解绑失败：' + e.message);
      }
    }

    async function setQuota(code, current) {
      const input = prompt('设置激活码 ' + code + ' 的 AI 生图总次数上限（当前 ' + current + '，填更大的数即为追加）：', current);
      if (input === null) return;
      const quota = parseInt(input, 10);
      if (isNaN(quota) || quota < 0 || quota > 100000) { alert('请输入 0~100000 的整数'); return; }
      try {
        await api('/api/admin/codes/quota', {
          method: 'POST',
          body: JSON.stringify({ code: code, imageQuota: quota })
        });
        loadList();
      } catch (e) {
        alert('设置失败：' + e.message);
      }
    }

    function render(codes) {
      document.getElementById('total').textContent = '共 ' + codes.length + ' 个';
      const tbody = document.getElementById('list');
      document.getElementById('empty').style.display = codes.length ? 'none' : '';
      tbody.innerHTML = codes.slice().reverse().map(c => {
        const devices = c.devices || [];
        const used = devices.length;
        const full = used >= c.maxDevices;
        const badge = full
          ? '<span class="badge bg-red-lt">' + used + ' / ' + c.maxDevices + ' 台</span>'
          : '<span class="badge bg-green-lt">' + used + ' / ' + c.maxDevices + ' 台</span>';
        const devTitle = devices.map(esc).join('&#10;');
        const quota = c.imageQuota || 0;
        const quotaBadge = quota > 0
          ? '<span class="badge bg-green-lt">' + quota + ' 次</span>'
          : '<span class="badge bg-secondary-lt">未开通</span>';
        return (
          '<tr>' +
            '<td class="font-monospace fw-bold code-cell" style="user-select:text">' + esc(c.code) + '</td>' +
            '<td><span title="' + (devTitle || '暂无绑定') + '">' + badge + '</span></td>' +
            '<td>' + quotaBadge + '</td>' +
            '<td class="text-secondary">' + esc(c.note || '—') + '</td>' +
            '<td class="text-secondary">' + new Date(c.createdAt).toLocaleString('zh-CN') + '</td>' +
            '<td>' + expiryCell(c) + '</td>' +
            '<td class="text-nowrap">' +
              '<button class="btn btn-sm btn-outline-secondary me-1" onclick="setQuota(\'' + esc(c.code) + '\', ' + quota + ')">改次数</button>' +
              '<button class="btn btn-sm btn-outline-primary me-1" onclick="copyCode(\'' + esc(c.code) + '\', this)">复制</button>' +
              (used ? '<button class="btn btn-sm btn-outline-danger me-1" onclick="unbind(\'' + esc(c.code) + '\')">解绑</button>' : '') +
              '<button class="btn btn-sm btn-outline-danger" onclick="deleteCode(\'' + esc(c.code) + '\')">删除</button>' +
            '</td>' +
          '</tr>'
        );
      }).join('');
    }

    loadList();
  </script>
</body>
</html>
