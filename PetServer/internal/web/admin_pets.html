<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线宠物 · cute pet 后台</title>
  <link rel="stylesheet" href="/static/tabler.min.css" />
  <script>
    if (!localStorage.getItem('petAdminSession')) location.replace('/admin/login');
  </script>
</head>
<body class="antialiased">
  <div class="page">
    <header class="navbar navbar-expand-md navbar-dark bg-dark d-print-none">
      <div class="container-xl">
        <span class="navbar-brand">🐾 cute pet 后台管理</span>
        <div class="navbar-nav flex-row ms-auto align-items-center">
          <a class="nav-link active fw-bold" href="/admin">在线宠物</a>
          <a class="nav-link" href="/admin/codes">激活码管理</a>
          <a class="nav-link" href="/admin/status">服务器状态</a>
          <a class="nav-link" href="/admin/files">文件管理</a>
          <a class="nav-link ms-3 text-warning" href="javascript:logout()">退出登录</a>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col">
              <h2 class="page-title">小猫在线列表</h2>
              <div class="text-secondary mt-1" id="status">正在连接服务器…</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">
          <div class="row row-cards">
            <div class="col-sm-6 col-lg-3">
              <div class="card">
                <div class="card-body">
                  <div class="text-secondary">在线</div>
                  <div class="h1 mb-0" id="onlineCount">-</div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-lg-3">
              <div class="card">
                <div class="card-body">
                  <div class="text-secondary">总设备</div>
                  <div class="h1 mb-0" id="totalCount">-</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card mt-3">
            <div class="card-header">
              <h3 class="card-title">设备列表</h3>
              <span class="ms-auto text-secondary">每 5 秒自动刷新</span>
            </div>
            <div class="table-responsive">
              <table class="table table-vcenter card-table table-hover">
                <thead>
                  <tr>
                    <th>宠物</th>
                    <th>状态</th>
                    <th>主机</th>
                    <th>版本</th>
                    <th>系统</th>
                    <th>架构</th>
                    <th>最近心跳</th>
                    <th>备注</th>
                    <th class="w-1">在线</th>
                    <th class="w-1">操作</th>
                  </tr>
                </thead>
                <tbody id="list"></tbody>
              </table>
            </div>
            <div class="card-body text-secondary text-center" id="empty" style="display:none">
              还没有宠物上报心跳哦～
            </div>
          </div>
        </div>
      </div>

      <footer class="footer footer-transparent d-print-none">
        <div class="container-xl text-center text-secondary">
          cute pet 后端服务 · UI 基于 Tabler（MIT）
        </div>
      </footer>
    </div>
  </div>

  <script>
    async function logout() {
      const token = localStorage.getItem('petAdminSession');
      localStorage.removeItem('petAdminSession');
      localStorage.removeItem('petAdminSessionExp');
      try {
        await fetch('/api/admin/logout', { method: 'POST', headers: { 'X-Session-Token': token || '' } });
      } catch (e) { /* 忽略网络异常 */ }
      location.href = '/admin/login';
    }

    const STATE = {
      focus: { face: '📚', label: '专注' },
      idel:  { face: '😸', label: '休闲' },
      sleep: { face: '😴', label: '睡觉' },
      pet:   { face: '🤗', label: '抚摸' },
      hide:  { face: '🫥', label: '躲藏' },
    };

    function stateOf(s) { return STATE[s] || { face: '🐱', label: s || '未知' }; }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
      ));
    }

    function agoText(sec) {
      if (sec < 60) return sec + ' 秒前';
      if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
      if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
      return Math.floor(sec / 86400) + ' 天前';
    }

    function render(data) {
      const devices = (data && data.devices) || [];
      document.getElementById('onlineCount').textContent = data ? data.online : '-';
      document.getElementById('totalCount').textContent = data ? data.total : '-';
      document.getElementById('status').textContent =
        '更新于 ' + new Date().toLocaleTimeString('zh-CN') +
        ' · 服务器 ' + (data && data.serverTime ? new Date(data.serverTime).toLocaleTimeString('zh-CN') : '--');

      const tbody = document.getElementById('list');
      document.getElementById('empty').style.display = devices.length ? 'none' : '';
      tbody.innerHTML = devices.map(d => {
        const st = stateOf(d.petState);
        const badge = d.online
          ? '<span class="badge bg-green-lt">在线</span>'
          : '<span class="badge bg-secondary-lt">离线</span>';
        return '<tr' + (d.online ? '' : ' class="text-secondary"') + '>' +
          '<td><span class="me-1">' + st.face + '</span><strong>' + esc(d.petName) + '</strong></td>' +
          '<td>' + esc(st.label) + '</td>' +
          '<td class="font-monospace">' + esc(d.hostname) + '</td>' +
          '<td>' + esc(d.version) + '</td>' +
          '<td>' + esc(d.os) + '</td>' +
          '<td>' + esc(d.machine) + '</td>' +
          '<td>' + agoText(d.secondsAgo) + '</td>' +
          '<td><input class="form-control form-control-sm note-input" style="min-width:120px" ' +
            'placeholder="点击填写备注" value="' + esc(d.note || '') + '" ' +
            'data-host="' + esc(d.hostname) + '" onchange="saveNote(this)"></td>' +
          '<td>' + badge + '</td>' +
          '<td><button class="btn btn-sm btn-outline-danger" data-host="' + esc(d.hostname) + '" ' +
            'data-online="' + (d.online ? '1' : '0') + '" data-pet="' + esc(d.petName) + '" ' +
            'onclick="deleteDevice(this)">删除</button></td>' +
        '</tr>';
      }).join('');
    }

    async function saveNote(input) {
      const hostname = input.getAttribute('data-host');
      const note = input.value.trim();
      input.disabled = true;
      try {
        const resp = await fetch('/api/admin/devices/note', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': localStorage.getItem('petAdminSession') || '' },
          body: JSON.stringify({ hostname: hostname, note: note })
        });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '保存失败');
        input.classList.add('is-valid');
        setTimeout(() => input.classList.remove('is-valid'), 1200);
      } catch (e) {
        input.classList.add('is-invalid');
        alert('备注保存失败：' + e.message);
      } finally {
        input.disabled = false;
      }
    }

    async function deleteDevice(btn) {
      const hostname = btn.getAttribute('data-host');
      const petName = btn.getAttribute('data-pet') || hostname;
      const isOnline = btn.getAttribute('data-online') === '1';
      // 在线设备删了也会随心跳重新出现，必须说清楚，避免误认为“删不掉”
      const tip = isOnline
        ? '「' + petName + '」当前在线，删除后约 1 分钟内会随心跳重新上报。\n确定仍要删除吗？'
        : '确定删除设备「' + petName + '」（' + hostname + '）的记录吗？\n删除后不可恢复（备注也会一并清除）。';
      if (!confirm(tip)) return;

      btn.disabled = true;
      try {
        const resp = await fetch('/api/admin/devices/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': localStorage.getItem('petAdminSession') || '' },
          body: JSON.stringify({ hostname: hostname })
        });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '删除失败');
        await load();   // 立即刷新列表，不等 5 秒周期
      } catch (e) {
        alert('删除失败：' + e.message);
        btn.disabled = false;
      }
    }

    let loading = false;
    let retryTimer = 0;

    async function load() {
      if (loading) return;          // 网络慢时避免请求堆积
      loading = true;
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 10000);
      try {
        const resp = await fetch('/api/devices', { headers: { 'Accept': 'application/json' }, signal: ctrl.signal });
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '接口返回异常');
        render(json.data);
      } catch (e) {
        // 链路抖动：1.5s 后重试一次，避免界面一直停在「加载失败」
        document.getElementById('status').textContent = '连接不稳，正在重试…';
        if (!retryTimer) {
          retryTimer = setTimeout(() => { retryTimer = 0; load(); }, 1500);
        }
      } finally {
        clearTimeout(timeout);
        loading = false;
      }
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
