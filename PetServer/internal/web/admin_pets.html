<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线宠物 · cute pet 后台</title>
  <link rel="stylesheet" href="/static/tabler.min.css" />
  <script src="/static/admin-nav.js?v=1"></script>
</head>
<body class="antialiased">
  <div class="page">
    <!-- 导航栏由 /static/admin-nav.js 统一渲染（菜单顺序单一来源） -->
    <div id="petAdminNav"></div>

    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col">
              <h2 class="page-title">小猫在线列表</h2>
              <div class="text-secondary mt-1" id="status">正在连接服务器…</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">
          <div class="row row-cards">
            <div class="col-sm-6 col-lg-3">
              <div class="card">
                <div class="card-body">
                  <div class="text-secondary">在线</div>
                  <div class="h1 mb-0" id="onlineCount">-</div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-lg-3">
              <div class="card">
                <div class="card-body">
                  <div class="text-secondary">总设备</div>
                  <div class="h1 mb-0" id="totalCount">-</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card mt-3">
            <div class="card-header">
              <h3 class="card-title">设备列表</h3>
              <span class="ms-auto text-secondary">每 5 秒自动刷新</span>
              <button class="btn btn-sm btn-primary ms-3" onclick="openPush('', '全部宠物')">全员推送</button>
            </div>
            <div class="table-responsive">
              <table class="table table-vcenter card-table table-hover">
                <thead>
                  <tr>
                    <th>宠物</th>
                    <th>宠物号</th>
                    <th>状态</th>
                    <th>主机</th>
                    <th>版本</th>
                    <th>系统</th>
                    <th>最近心跳</th>
                    <th>备注</th>
                    <th class="w-1">在线</th>
                    <th class="w-1">操作</th>
                  </tr>
                </thead>
                <tbody id="list"></tbody>
              </table>
            </div>
            <div class="card-body text-secondary text-center" id="empty" style="display:none">
              还没有宠物上报心跳哦～
            </div>
          </div>

          <div class="card mt-3">
            <div class="card-header">
              <h3 class="card-title">推送记录</h3>
              <span class="ms-auto text-secondary">随心跳一次性下发，同一台设备只执行一次</span>
              <button class="btn btn-sm btn-outline-secondary ms-3" onclick="loadPushes()">刷新</button>
            </div>
            <div class="table-responsive">
              <table class="table table-vcenter card-table">
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>类型</th>
                    <th>目标</th>
                    <th>内容</th>
                    <th>已下发</th>
                    <th class="w-1"></th>
                  </tr>
                </thead>
                <tbody id="pushList"></tbody>
              </table>
            </div>
            <div class="card-body text-secondary text-center" id="pushEmpty" style="display:none">
              还没有推送过任何内容
            </div>
          </div>
        </div>
      </div>

      <div class="modal modal-blur" id="pushModal" style="display:none">
        <div class="modal-dialog modal-dialog-centered" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="pushModalTitle">推送</h5>
              <button type="button" class="btn-close" onclick="closePush()"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">类型</label>
                <select class="form-select" id="pushKind" onchange="syncPushForm()">
                  <option value="text">文字通知</option>
                  <option value="video">视频</option>
                  <option value="update">触发客户端检查更新</option>
                </select>
              </div>
              <div class="mb-3" id="pushTitleRow">
                <label class="form-label">标题</label>
                <input class="form-control" id="pushTitle" placeholder="例如：今晚 8 点维护" />
              </div>
              <div class="mb-3" id="pushTextRow">
                <label class="form-label">文字内容</label>
                <textarea class="form-control" id="pushText" rows="4" placeholder="要显示给用户的文字"></textarea>
              </div>
              <div class="mb-3" id="pushUrlRow" style="display:none">
                <label class="form-label">视频地址（mp4 / https）</label>
                <input class="form-control" id="pushUrl" placeholder="https://…/video.mp4" />
              </div>
              <div class="mb-3" id="pushDurationRow">
                <label class="form-label">自动关闭（秒，0 = 手动关）</label>
                <input class="form-control" id="pushDuration" type="number" min="0" value="0" />
              </div>
              <div class="text-secondary" id="pushTargetText"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-link" onclick="closePush()">取消</button>
              <button type="button" class="btn btn-primary" id="pushSubmit" onclick="submitPush()">发送</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="footer footer-transparent d-print-none">
        <div class="container-xl text-center text-secondary">
          cute pet 后端服务 · UI 基于 Tabler（MIT）
        </div>
      </footer>
    </div>
  </div>

  <script>
    // 登录守卫、导航栏、session()/logout() 统一由 /static/admin-nav.js 提供

    const STATE = {
      focus: { face: '📚', label: '专注' },
      idel:  { face: '😸', label: '休闲' },
      sleep: { face: '😴', label: '睡觉' },
      pet:   { face: '🤗', label: '抚摸' },
      hide:  { face: '🫥', label: '躲藏' },
    };

    function stateOf(s) { return STATE[s] || { face: '🐱', label: s || '未知' }; }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
      ));
    }

    function agoText(sec) {
      if (sec < 60) return sec + ' 秒前';
      if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
      if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
      return Math.floor(sec / 86400) + ' 天前';
    }

    function render(data) {
      const devices = (data && data.devices) || [];
      document.getElementById('onlineCount').textContent = data ? data.online : '-';
      document.getElementById('totalCount').textContent = data ? data.total : '-';
      document.getElementById('status').textContent =
        '更新于 ' + new Date().toLocaleTimeString('zh-CN') +
        ' · 服务器 ' + (data && data.serverTime ? new Date(data.serverTime).toLocaleTimeString('zh-CN') : '--');

      const tbody = document.getElementById('list');
      document.getElementById('empty').style.display = devices.length ? 'none' : '';
      tbody.innerHTML = devices.map(d => {
        const st = stateOf(d.petState);
        const badge = d.online
          ? '<span class="badge bg-green-lt">在线</span>'
          : '<span class="badge bg-secondary-lt">离线</span>';
        return '<tr' + (d.online ? '' : ' class="text-secondary"') + '>' +
          '<td><span class="me-1">' + st.face + '</span><strong>' + esc(d.petName) + '</strong></td>' +
          '<td class="font-monospace">' + (d.petNo ? '#' + d.petNo : '—') + '</td>' +
          '<td>' + esc(st.label) + '</td>' +
          '<td class="font-monospace">' + esc(d.hostname) + '</td>' +
          '<td>' + esc(d.version) + '</td>' +
          '<td>' + esc(d.os) + '</td>' +
          '<td>' + agoText(d.secondsAgo) + '</td>' +
          '<td><input class="form-control form-control-sm note-input" style="min-width:120px" ' +
            'placeholder="点击填写备注" value="' + esc(d.note || '') + '" ' +
            'data-host="' + esc(d.hostname) + '" onchange="saveNote(this)"></td>' +
          '<td>' + badge + '</td>' +
          '<td class="text-nowrap">' +
            '<button class="btn btn-sm btn-outline-primary me-1" data-id="' + esc(d.deviceId || '') + '" ' +
              'data-pet="' + esc(d.petName) + '" onclick="openPush(this.getAttribute(\'data-id\'), this.getAttribute(\'data-pet\'))">推送</button>' +
            '<button class="btn btn-sm btn-outline-danger" data-host="' + esc(d.hostname) + '" ' +
              'data-online="' + (d.online ? '1' : '0') + '" data-pet="' + esc(d.petName) + '" ' +
              'onclick="deleteDevice(this)">删除</button></td>' +
        '</tr>';
      }).join('');
    }

    async function saveNote(input) {
      const hostname = input.getAttribute('data-host');
      const note = input.value.trim();
      input.disabled = true;
      try {
        const resp = await fetch('/api/admin/devices/note', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': session() },
          body: JSON.stringify({ hostname: hostname, note: note })
        });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '保存失败');
        input.classList.add('is-valid');
        setTimeout(() => input.classList.remove('is-valid'), 1200);
      } catch (e) {
        input.classList.add('is-invalid');
        alert('备注保存失败：' + e.message);
      } finally {
        input.disabled = false;
      }
    }

    async function deleteDevice(btn) {
      const hostname = btn.getAttribute('data-host');
      const petName = btn.getAttribute('data-pet') || hostname;
      const isOnline = btn.getAttribute('data-online') === '1';
      // 在线设备删了也会随心跳重新出现，必须说清楚，避免误认为“删不掉”
      const tip = isOnline
        ? '「' + petName + '」当前在线，删除后约 1 分钟内会随心跳重新上报。\n确定仍要删除吗？'
        : '确定删除设备「' + petName + '」（' + hostname + '）的记录吗？\n删除后不可恢复（备注也会一并清除）。';
      if (!confirm(tip)) return;

      btn.disabled = true;
      try {
        const resp = await fetch('/api/admin/devices/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': session() },
          body: JSON.stringify({ hostname: hostname })
        });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '删除失败');
        await load();   // 立即刷新列表，不等 5 秒周期
      } catch (e) {
        alert('删除失败：' + e.message);
        btn.disabled = false;
      }
    }

    let loading = false;
    let retryTimer = 0;

    async function load() {
      if (loading) return;          // 网络慢时避免请求堆积
      loading = true;
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 10000);
      try {
        const resp = await fetch('/api/devices', { headers: { 'Accept': 'application/json' }, signal: ctrl.signal });
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '接口返回异常');
        render(json.data);
      } catch (e) {
        // 链路抖动：1.5s 后重试一次，避免界面一直停在「加载失败」
        document.getElementById('status').textContent = '连接不稳，正在重试…';
        if (!retryTimer) {
          retryTimer = setTimeout(() => { retryTimer = 0; load(); }, 1500);
        }
      } finally {
        clearTimeout(timeout);
        loading = false;
      }
    }

    // ── 运营推送（文字 / 视频 / 触发更新）──
    let pushTarget = { deviceId: '', label: '全部宠物' };

    function openPush(deviceId, label) {
      pushTarget = { deviceId: deviceId || '', label: label || '全部宠物' };
      document.getElementById('pushModalTitle').textContent = '推送给「' + pushTarget.label + '」';
      document.getElementById('pushTargetText').textContent = pushTarget.deviceId
        ? '设备 ID：' + pushTarget.deviceId
        : '不指定设备 = 广播给所有宠物（各自只执行一次）';
      document.getElementById('pushKind').value = 'text';
      document.getElementById('pushTitle').value = '';
      document.getElementById('pushText').value = '';
      document.getElementById('pushUrl').value = '';
      document.getElementById('pushDuration').value = '0';
      syncPushForm();
      const modal = document.getElementById('pushModal');
      modal.style.display = 'block';
      modal.classList.add('show');
    }

    function closePush() {
      const modal = document.getElementById('pushModal');
      modal.classList.remove('show');
      modal.style.display = 'none';
    }

    function syncPushForm() {
      const kind = document.getElementById('pushKind').value;
      document.getElementById('pushTextRow').style.display = kind === 'text' ? '' : 'none';
      document.getElementById('pushDurationRow').style.display = kind === 'text' ? '' : 'none';
      document.getElementById('pushUrlRow').style.display = kind === 'video' ? '' : 'none';
      document.getElementById('pushTitleRow').style.display = kind === 'update' ? 'none' : '';
    }

    async function submitPush() {
      const btn = document.getElementById('pushSubmit');
      const kind = document.getElementById('pushKind').value;
      const body = {
        kind: kind,
        deviceId: pushTarget.deviceId,
        title: document.getElementById('pushTitle').value.trim(),
        text: document.getElementById('pushText').value.trim(),
        url: document.getElementById('pushUrl').value.trim(),
        durationMs: Math.max(0, Number(document.getElementById('pushDuration').value) || 0) * 1000,
      };
      if (kind === 'text' && !body.text) { alert('文字推送要填内容'); return; }
      if (kind === 'video' && !body.url) { alert('视频推送要填地址'); return; }

      btn.disabled = true;
      try {
        const resp = await fetch('/api/admin/push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': session() },
          body: JSON.stringify(body)
        });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '发送失败');
        closePush();
        await loadPushes();
      } catch (e) {
        alert('推送失败：' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    const PUSH_KIND_LABEL = { text: '📝 文字', video: '🎬 视频', update: '🔄 更新' };

    async function loadPushes() {
      const tbody = document.getElementById('pushList');
      try {
        const resp = await fetch('/api/admin/push/list', { headers: { 'X-Session-Token': session() } });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '加载失败');
        const list = (json.data && json.data.commands) || [];
        document.getElementById('pushEmpty').style.display = list.length ? 'none' : '';
        tbody.innerHTML = list.map(c => {
          const when = new Date(c.createdAt).toLocaleString('zh-CN');
          const content = c.kind === 'video' ? esc(c.url || '') : esc(c.text || '');
          const target = c.deviceId ? '<span class="font-monospace">' + esc(c.deviceId) + '</span>' : '<span class="badge bg-blue-lt">广播</span>';
          const delivered = (c.deliveredTo || []).length;
          return '<tr>' +
            '<td class="text-secondary text-nowrap">' + when + '</td>' +
            '<td class="text-nowrap">' + (PUSH_KIND_LABEL[c.kind] || esc(c.kind)) + '</td>' +
            '<td>' + target + '</td>' +
            '<td class="text-truncate" style="max-width:280px">' + (esc(c.title || '') || content) + '</td>' +
            '<td>' + (delivered ? delivered + ' 台' : '待下发') + '</td>' +
            '<td><button class="btn btn-sm btn-outline-danger" onclick="deletePush(\'' + esc(c.id) + '\')">删除</button></td>' +
            '</tr>';
        }).join('');
      } catch (e) {
        document.getElementById('pushEmpty').style.display = '';
        document.getElementById('pushEmpty').textContent = '推送记录加载失败：' + e.message;
      }
    }

    async function deletePush(id) {
      if (!confirm('删除这条推送？已下发的不会撤回。')) return;
      try {
        const resp = await fetch('/api/admin/push/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': session() },
          body: JSON.stringify({ id: id })
        });
        if (resp.status === 401) { localStorage.removeItem('petAdminSession'); location.replace('/admin/login'); return; }
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.msg || '删除失败');
        await loadPushes();
      } catch (e) {
        alert('删除失败：' + e.message);
      }
    }

    load();
    setInterval(load, 5000);
    loadPushes();
    setInterval(loadPushes, 15000);
  </script>
</body>
</html>
